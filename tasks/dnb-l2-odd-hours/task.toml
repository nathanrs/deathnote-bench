schema_version = "1.4"

[metadata]
level = 2
template = "odd_hours"
seed = 2107

[verifier]
timeout_sec = 300.0
environment_mode = "shared"
user = "root"

[agent]
timeout_sec = 2700.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "bash /opt/game/start.sh"
interval_sec = 2
timeout_sec = 30
retries = 5
