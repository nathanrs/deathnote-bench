name: lightloop

install_cmd: "bash setup.sh"

final_output: /logs

defaults:
  model:
    type: str
    required: true
  effort:
    type: str
    required: false
    default: low

run_cmd: >-
  bash -lc 'mkdir -p /logs &&
  /bundle/lightloop/.venv/bin/python /bundle/lightloop/run.py {problem_statement_path} --model {model} --effort {effort}'
